line_follower_node:
  ros__parameters:
    kp: 0.4
    ki: 0.0
    kd: 0.06
    linear_speed: 0.18
    slow_speed: 0.05
    max_acceleration: 0.10
    max_angular_speed: 1.0
    roi_top_ratio: 0.70
    roi_bottom_ratio: 0.90
    roi_left_ratio: 0.20
    roi_right_ratio: 0.80
    processing_fps: 15.0
    debug_publish_rate_hz: 10.0
    # Manuver belok Fase 4 (odometri-assisted turning + LCTT + bidirectional sweep)
    turn_angle_rad: 1.20 # ~69 derajat coarse turn sebelum LCTT mengunci garis cabang
    turn_speed_radps: 0.35
    min_turn_speed_radps: 0.12 # kecepatan putar minimum saat ramp-down
    yaw_kp: 1.2 # gain proporsional deselerasi yaw
    seek_kp: 1.2 # gain PID visual LCTT untuk memusatkan garis
    turn_timeout_sec: 12.0
    reacquire_frames: 3 # frame garis baru harus stabil di tengah sebelum kembali FOLLOW
    reacquire_error_threshold: 0.25 # toleransi posisi tengah garis di ROI
    reacquire_search_angle_rad: 0.60 # batas sweep balik bila garis terlewat (overshoot)
    status_topic: "/line_follower/state"

odometry_node:
  ros__parameters:
    wheel_diameter_m: 0.15
    wheel_separation_m: 0.48
    encoder_pulses_per_wheel_rev: 900
    encoder_delta_topic: "/agv/encoder_delta"
    odom_topic: "/odom"
    path_topic: "/path"

goal_follower_node:
  ros__parameters:
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    goal_topic: "/goal_pose"
    odom_topic: "/odom"
    cmd_vel_topic: "/cmd_vel"
    status_topic: "/goal_follower/state"
    marker_topic: "/goal_follower/active_goal_marker"
    kp_linear: 0.5
    kp_angular: 1.2
    max_linear_speed: 0.15
    min_linear_speed: 0.04
    max_angular_speed: 0.60
    min_angular_speed: 0.12
    max_linear_accel: 0.15
    max_angular_accel: 0.80
    xy_goal_tolerance: 0.05
    yaw_goal_tolerance: 0.10
    heading_tolerance_to_drive: 0.30
    align_final_yaw: true
    goal_timeout_sec: 60.0
    control_rate_hz: 20.0
