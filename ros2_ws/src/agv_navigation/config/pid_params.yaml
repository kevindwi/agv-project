line_follower_node:
  ros__parameters:
    kp: 0.4
    ki: 0.0
    kd: 0.06
    linear_speed: 0.18
    slow_speed: 0.05
    max_acceleration: 0.10
    max_angular_speed: 1.0
    roi_top_ratio: 0.70
    roi_bottom_ratio: 0.90
    roi_left_ratio: 0.20
    roi_right_ratio: 0.80
    processing_fps: 15.0
    debug_publish_rate_hz: 10.0
    # Manuver belok Fase 4 (odometri-assisted turning)
    turn_angle_rad: 1.57 # 90 derajat; sesuaikan sudut cabang fisik (maks. 3.14)
    turn_speed_radps: 0.40
    turn_timeout_sec: 12.0
    reacquire_frames: 4 # frame garis baru harus stabil sebelum kembali FOLLOW
    reacquire_error_threshold: 0.25 # toleransi posisi garis di ROI
    reacquire_search_angle_rad: 0.55 # batas pencarian garis setelah belok
    status_topic: "/line_follower/state"

odometry_node:
  ros__parameters:
    wheel_diameter_m: 0.15
    wheel_separation_m: 0.454
    encoder_pulses_per_wheel_rev: 610
    encoder_delta_topic: "/agv/encoder_delta"
    odom_topic: "/odom"
    path_topic: "/path"
