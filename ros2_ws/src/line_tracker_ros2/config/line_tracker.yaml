line_tracker_node:
  ros__parameters:
    camera_index: 3 # index perangkat V4L2
    serial_port: /dev/ttyUSB0
    baud_rate: 115200

    # --- Kalibrasi fisik robot (Tahap 0) ---
    wheel_diameter_m: 0.15 # diameter efektif roda (15 cm)
    wheel_separation_m: 0.48 # jarak pusat roda kiri-kanan (48 cm)
    gear_ratio: 30.0 # gearbox 30:1
    encoder_pulses_per_motor_rev: 30 # pulsa encoder per putaran poros motor
    encoder_pulses_per_wheel_rev: 900 # 30 x 30 = tepat 900 pulsa/putaran roda

    # PID line tracking (error ternormalisasi)
    kp: 1.0
    ki: 0.0
    kd: 0.0

    linear_speed_mps: 0.30 # kecepatan maju robot (m/s) -> PWM ~20
    max_angular_speed_radps: 1.0 # batas kecepatan putar robot
    max_wheel_speed_mps: 0.30 # skala perkiraan untuk konversi ke PWM
    publish_rate_hz: 30.0 # frekuensi loop (setara FPS kamera)

odometry_node:
  ros__parameters:
    # Kalibrasi DDMR: sinkron dengan nilai perangkat keras di atas.
    wheel_diameter_m: 0.15
    wheel_separation_m: 0.48
    encoder_pulses_per_wheel_rev: 900
    encoder_delta_topic: /line_tracker/encoder_delta
    odom_topic: /odom
    path_topic: /path
    max_path_poses: 10000
    path_publish_rate_hz: 2.0
    odom_frame_id: odom
    base_frame_id: base_link

mission_manager_node:
  ros__parameters:
    # Kecepatan putar saat belokan odometri (rad/s). Turunkan jika robot selip.
    turn_speed_radps: 0.5
    # Sudut target belokan (derajat). Ubah ke 180.0 untuk putar balik.
    turn_angle_deg: 90.0
    # Toleransi sudut belokan (derajat). Perbesar jika robot berhenti terlalu awal.
    turn_angle_tolerance_deg: 3.0
    # Jarak minimum antar-persimpangan (meter) untuk mencegah deteksi ganda.
    # Setel lebih besar dari lebar garis crossbar di lintasan.
    intersection_debounce_distance_m: 0.30
    # True: misi dimulai otomatis saat node aktif.
    # False: tunggu perintah eksternal (untuk debugging per-state).
    auto_start: true
