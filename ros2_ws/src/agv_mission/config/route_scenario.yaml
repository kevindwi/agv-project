aruco_detector_node:
  ros__parameters:
    image_topic: "/camera/image_raw"
    detection_topic: "/aruco/detection"
    debug_topic: "/aruco/debug_image"
    dictionary_id: 0 # OpenCV DICT_4X4_50
    marker_length_m: 0.10 # 10 cm
    processing_fps: 20.0 # Sedikit di atas kamera agar jitter tidak membuang frame
    debug_publish_rate_hz: 10.0 # Batasi gambar debug agar tidak membebani kamera
    # Matriks 640x480 diskalakan 0.5 untuk mode kamera 320x240.
    camera_matrix:
      [
        395.8151997816417,
        0.0,
        149.20168197776022,
        0.0,
        396.71266351499925,
        106.59178805765247,
        0.0,
        0.0,
        1.0,
      ]
    distortion_coefficients:
      [
        -0.11057324510626881,
        3.154720998614776,
        -0.008027824721255019,
        -0.005371195079737162,
        -16.008392043727394,
      ]

mission_controller_node:
  ros__parameters:
    confirm_frames: 3
    trigger_distance_m: 0.70 # Jarak picu deteksi ArUco (lebih jauh agar robot punya waktu konfirmasi)
    creep_distance_m: 0.66 # Fallback jarak merayap statis bila use_dynamic_creep=false
    use_dynamic_creep: true # Hitung jarak merayap dinamis dari tvec.z * cos(pitch) + camera_offset_m
    camera_offset_m: 0.45 # Jarak fisik sumbu roda ke kamera (meter)
    camera_pitch_deg: 45.0 # Kemiringan kamera menghadap ke bawah (derajat)
    center_tolerance_m: 0.05 # Toleransi perataan lateral marker (5 cm)
    slow_distance_m: 2.00 # Dibuat besar agar tidak memblokir deteksi (slow_down_on_approach=false)
    detection_timeout_sec: 1.5 # Toleran terhadap frame drop antar deteksi
    route_ids: [1, 2, 3] # Urutan checkpoint ID marker
    # Aksi per checkpoint: straight | left | right | stop
    route_actions: ["straight", "left", "stop"]

    transit_hold_sec: 0.8 # Jeda melambat di CP1 sebelum lanjut
    control_topic: "/mission/control"
    detection_topic: "/aruco/detection"
    line_status_topic: "/line_follower/state"
    odom_topic: "/odom"
    slow_down_on_approach: false  # Disable automatic slow phase before creep
    creep_with_slow_speed: false  # Use normal FOLLOW speed during creep

