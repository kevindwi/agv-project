mission_controller_node:
  ros__parameters:
    confirm_frames: 3
    trigger_distance_m: 0.30 # Jarak picu berhenti di checkpoint (meter)
    slow_distance_m: 0.90    # Jarak mulai melambat dari jauh (meter)
    route_ids: [1, 2, 3]     # Urutan checkpoint ID marker
